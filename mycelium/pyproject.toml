[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mycelium"
version = "0.1.0"
description = "MYCELIUM v0.1: small honest model pipeline (distill, RLCR, TRIAGE, HIKMAT memory, autopilot) with a mock backend for end-to-end testing."
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["mycelium*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
